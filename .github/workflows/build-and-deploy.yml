name: Build (Node 20)

on:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Build on Node 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          export NODE_OPTIONS=--max-old-space-size=4096
          npm run build